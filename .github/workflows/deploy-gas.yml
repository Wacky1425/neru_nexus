name: Deploy GAS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.clasp.json'
      - '.github/workflows/deploy-gas.yml'

permissions:
  contents: read

concurrency:
  group: deploy-gas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Restore clasp credentials
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Check Apps Script project
        run: clasp status

      - name: Push GAS source
        run: clasp push --force

      - name: Create Apps Script version
        id: gas_version
        shell: bash
        run: |
          OUTPUT="$(clasp version "GitHub ${GITHUB_SHA}")"
          echo "$OUTPUT"
          VERSION="$(printf '%s\n' "$OUTPUT" | grep -oE '[0-9]+' | tail -1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update production web app deployment
        shell: bash
        env:
          GAS_DEPLOYMENT_ID: AKfycbwTuIVL4UyAThZdiaBRTM9lxnFxIrNN3LMwHhx1ZNTekGuzzFCUo-QHBtjXsFFSKZ4Igw
          GAS_VERSION: ${{ steps.gas_version.outputs.version }}
        run: |
          clasp deploy --deploymentId "$GAS_DEPLOYMENT_ID" --versionNumber "$GAS_VERSION" --description "GitHub ${GITHUB_SHA}"
