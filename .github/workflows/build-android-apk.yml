name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/neru-debug.keystore
          chmod 600 android/neru-debug.keystore

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        env:
          NERU_KEYSTORE_PATH: ../neru-debug.keystore
          NERU_KEYSTORE_PASSWORD: android
          NERU_KEY_ALIAS: androiddebugkey
          NERU_KEY_PASSWORD: android
        run: flutter build apk --release

      - name: Prepare release APK
        run: |
          VERSION="$(sed -n 's/^version: //p' pubspec.yaml | tr '+' '-')"
          APK_NAME="neru-nexus-v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "../${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neru-nexus-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Neru Nexus Latest
          prerelease: true
          files: ${{ env.APK_NAME }}
          overwrite_files: true
          body: |
            Latest automatically built Neru Nexus APK.
            Source commit: ${{ github.sha }}
