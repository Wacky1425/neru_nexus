name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Prepare release APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ../neru-nexus.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neru-nexus-apk
          path: neru-nexus.apk
          if-no-files-found: error
      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Neru Nexus Latest
          prerelease: true
          files: neru-nexus.apk
          body: |
            Latest automatically built Neru Nexus APK.
            Source commit: ${{ github.sha }}
