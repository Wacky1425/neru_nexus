name: app
description: "A new Flutter project."
publish_to: 'none'

version: 2.2.17+237

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.1
  webview_flutter: ^4.14.1
  fl_chart: ^1.0.0
  file_picker: 10.3.10
  charset: ^2.0.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/neru_nexus_icon.png"
  adaptive_icon_background: "#0B1020"
  adaptive_icon_foreground: "assets/icons/neru_nexus_icon.png"
